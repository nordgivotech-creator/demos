 const nav=el('nav','nv');nav.setAttribute('aria-label','Huvudmeny');PAGES.forEach(([id,l])=>{const a=el('button','lk'+(id===page?' on':''),l);a.type='button';if(id===page)a.setAttribute('aria-current','page');a.onclick=()=>{nav.classList.remove('open');V==='simple'?go(id==='hem'?'top':id):show(id)};nav.append(a)});

 const a=el('div','ac');a.append(cta(P.cta||'Be om offert'));const t=el('button','ghost','Se våra tjänster');t.type='button';t.onclick=()=>go('tjanster');a.append(t);d.append(a);

function form(small){const f=el('form','fm');f.noValidate=true;const mk=(ph,tp)=>{const w=el('div','fld');const i=el('input');i.placeholder=ph;i.type=tp||'text';i.setAttribute('aria-label',ph);const e=el('small','er');w.append(i,e);return [w,i,e]};

 f.append(wn,wt,sel);if(!small){f.append(m);f.append(slots())}const b=el('button','cta','Skicka förfrågan');b.type='submit';f.append(b,el('small','nt','Exempelformulär: inget skickas på riktigt.'));
 f.onsubmit=e=>{e.preventDefault();let bad=false;en.textContent='';et.textContent='';if(n.value.trim().length<2){en.textContent='Skriv ditt namn.';bad=true}if(!/^(\+?[\d\s-]{6,}|[^@\s]+@[^@\s]+\.[^@\s]+)$/.test(t.value.trim())){et.textContent='Ange telefon eller e-post.';bad=true}if(bad)return;
  const ok=el('div','ok');ok.setAttribute('role','status');ok.append(icon('check',22),el('div','','Tack '+n.value.trim().split(' ')[0]+'! Din förfrågan om "'+sel.value+'" är mottagen (exempel). Du får svar inom en arbetsdag.'));f.replaceWith(ok);inbox(n.value.trim(),sel.value+(SLOT&&!small?' · '+SLOT:''))};return f}

 L.forEach(x=>['08–10','13–15'].forEach(t=>{const lab=x.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'})+' '+t,b=el('button','chip',lab);b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>{SLOT=SLOT===lab?'':lab;r.querySelectorAll('.chip').forEach(c=>{const on=c===b&&SLOT===lab;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)})};r.append(b)}));w.append(r);return w}

 [['check','Genomgång av ert behov'],['check','Tydligt förslag innan något startar'],['check','Uppföljning när arbetet är klart']].forEach(([n,t])=>{const r=el('div','row');r.append(icon(n,18),el('span','',t));c.append(r)});
 const l=el('div','card');l.append(el('h3','','Så går det till'));(P.process||[]).forEach((p,k)=>{const r=el('div','row');r.append(el('span','nr',String(k+1)),el('span','',p));l.append(r)});g.append(c,l);s.append(g,cta('Fråga om '+x.toLowerCase(),'kontakt'));const q=el('button','cta','Fråga om '+x.toLowerCase());q.type='button';q.onclick=()=>{pre(x);show('kontakt')};s.lastChild.replaceWith(q);return s}

function areas(){const s=sec('Här arbetar vi','omraden','Hör av dig även om du bor lite utanför, vi tittar på det tillsammans.');const w=el('div','card ar'),m=el('div','map');m.append(icon('pin',30));w.append(m);const c=el('div','chips');(P.cities||[CO.city||'Närområdet']).forEach(x=>{const b=el('span','chip on',x);c.append(b)});w.append(c);s.append(w);return s}
function finder(){const s=sec('Hitta rätt tjänst','hitta','Svara på två snabba frågor så föreslår vi var ni bör börja.');const c=el('div','card fd');let a=-1,b=-1;
 const Q=[['Vad gäller det?',['Jag vill ha en offert','Jag har ett akut problem','Jag vill bara få råd']],['När vill ni komma igång?',['Så snart som möjligt','Inom några veckor','Jag planerar framåt']]];const out=el('div','fo');
 function res(){out.textContent='';if(a<0||b<0)return;const k=(a+b)%P.services.length,x=P.services[k];const t=el('div','card sv');const ic=el('div','ic');ic.append(icon(svcIcon(x,k)));t.append(ic,el('b','','Vi föreslår: '+x),el('p','',(P.svc_text&&P.svc_text[k])||''));const go2=el('button','cta','Be om offert på '+x.toLowerCase());go2.type='button';go2.onclick=()=>{pre(x);go('kontakt')};t.append(go2);out.append(t)}
 Q.forEach((q,qi)=>{const r=el('div','fq');r.append(el('b','',q[0]));const ch=el('div','chips');q[1].forEach((l,i)=>{const x=el('button','chip',l);x.type='button';x.setAttribute('aria-pressed','false');x.onclick=()=>{qi?b=i:a=i;ch.querySelectorAll('.chip').forEach((y,j)=>{const on=j===i;y.classList.toggle('on',on);y.setAttribute('aria-pressed',on)});res()};ch.append(x)});r.append(ch);c.append(r)});c.append(out);s.append(c);return s}
function band(){const s=el('section','band rv');const t=el('div');t.append(el('h2','','Redo att komma igång?'),el('p','','Berätta vad ni behöver, så återkommer vi inom en arbetsdag.'));s.append(t,cta(P.cta||'Be om offert','kontakt'));return s}

 const r=el('div','card');r.append(el('h3','','Därför välja oss'));P.usp.forEach((x,i)=>{const w=el('div','row');w.append(icon(['shield','clock','check'][i%3],20),el('span','',x));r.append(w)});g.append(c,r);s.append(g);return s}

 [['pin',CO.city?'Verksamhetsort: '+CO.city:'Hela närområdet'],['mail','Svar via mejl eller telefon, ni väljer'],['clock','Svar inom en arbetsdag (exempel)']].forEach(([n,t])=>{const r=el('div','row');r.append(icon(n,18),el('span','',t));i.append(r)});if(CO.website)i.append(el('p','nt',CO.website));

function upg(){const s=sec('Före och efter',null,'Dra i reglaget och jämför en typisk gammal sida med den nya.');const c=el('div','card');const r=el('input');r.type='range';r.min=5;r.max=95;r.value=50;r.setAttribute('aria-label','Före och efter');const w=el('div','ba');const a=el('div','pa pn');a.append(el('b','',CO.name),el('p','',P.lead||CO.tagline||'Tydligt erbjudande, snabb laddning och ett enda mål: att du ringer eller ber om offert.'),el('span','cta','Be om offert'));
 const b=el('div','pa po');b.append(el('h3','','Välkommen till '+CO.name),el('p','','Lång text. Många menyval. Otydlig kontakt. Laddar långsamt på mobil.'),el('small','','Kontakt | Om oss | Länkar | Nyheter | Galleri'));const h=el('div','hn');w.append(a,b,h);
 const up=()=>{b.style.clipPath='inset(0 '+(100-r.value)+'% 0 0)';h.style.left=r.value+'%'};r.oninput=up;up();c.append(w,r);
 const k=el('div','gr');[['Mål','Laddtid under 1 sekund på mobil'],['Mål','Tydlig kontaktväg på varje sida'],['Mål','Texter ni godkänt'],['Mål','Fungerar lika bra i mobilen']].forEach(x=>{const d=el('div','card');d.append(el('small','nt',x[0]),el('b','',x[1]));k.append(d)});s.append(c,k);return s}

function body(){const m=el('main','pg');m.id='main';

 if(V==='simple'){m.append(hero(),trust(),services(),process(),finder(),faq(),band(),contact());return m}

 if(page==='tjanster')m.append(services(),process(),band());if(page==='tjanst')m.append(detail());if(page==='om')m.append(about(),areas());if(page==='fragor')m.append(faq(),band());if(page==='kontakt')m.append(contact());

 const d=el('button','pill','Mörkt läge');d.type='button';d.onclick=()=>document.body.classList.toggle('dark');r.append(d);b.append(r);return b}
